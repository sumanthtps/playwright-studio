<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fieldnotes checkout · demo store</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 56px; background: #f3f4ef; color: #163b32; font: 18px system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid #ccd8cc; }
    header strong { font-size: 28px; letter-spacing: -1px; }
    .badge { border: 1px solid #b9cec0; border-radius: 30px; padding: 8px 15px; font-size: 13px; }
    h1 { margin: 36px 0 8px; font-size: 38px; letter-spacing: -1px; }
    p { color: #60776b; margin: 0 0 26px; }
    main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; }
    section { background: white; border: 1px solid #dce3d9; border-radius: 14px; padding: 28px; }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-size: 14px; margin: 24px 0 8px; }
    input { width: 100%; padding: 14px; border: 1px solid #bdcec3; border-radius: 8px; font: inherit; }
    button { padding: 12px 20px; border-radius: 8px; border: 1px solid #a4bcae; background: white; color: #23483a; cursor: pointer; font: inherit; }
    #checkout { margin-top: 22px; width: 100%; background: #17654d; color: white; border: 0; font-weight: 650; }
    .product { display: flex; align-items: center; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid #e4e9e2; }
    .product img { background: #d5e6d6; border-radius: 10px; width: 64px; height: 72px; padding: 16px; }
    .product small { display: block; color: #718075; margin-top: 5px; }
    .total { display: flex; justify-content: space-between; padding-top: 24px; font-size: 22px; }
    footer { display: flex; gap: 12px; align-items: center; margin-top: 26px; font-size: 12px; color: #718075; }
    footer button { font-size: 12px; padding: 6px 10px; }
    iframe { width: 100%; height: 54px; border: 1px solid #e0e6df; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <header><strong>fieldnotes.</strong><span class="badge">Sample storefront · local demo</span></header>
  <h1>A little more room for ideas.</h1><p>Finish your order. Start your next chapter.</p>
  <main>
    <section><h2>Contact &amp; checkout</h2><label for="email">Email address</label><input id="email" placeholder="name@example.com"><button id="checkout" data-testid="checkout">Checkout</button><iframe title="Payments" src="/frame"></iframe></section>
    <section><h2>Your bag</h2><div class="product"><img alt="Company logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2317654d' d='M4 2h16v20H4z'/%3E%3Cpath stroke='white' d='M8 7h8M8 11h8M8 15h5'/%3E%3C/svg%3E"><div>Everyday notebook<small>Forest green · dotted · A5</small></div></div><div class="total"><span>Total</span><strong>$24.00</strong></div></section>
  </main>
  <footer><span>Demo controls</span><button>Repeat</button><button data-testid="second-repeat">Repeat</button><div id="shadow"></div></footer>
  <script>document.getElementById('shadow').attachShadow({mode:'open'}).innerHTML='<button data-testid="shadow-save">Save in shadow</button>';</script>
</body>
</html>
