name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validation.yml

  release:
    name: Release to VS Marketplace
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the validated extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: validated-vsix

      - name: Verify the validated package before publishing
        run: node scripts/verify-vsix.js playwright-studio-ci.vsix

      - name: Publish to VS Marketplace
        run: npx --no-install vsce publish --packagePath playwright-studio-ci.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: playwright-studio-ci.vsix
          generate_release_notes: true
